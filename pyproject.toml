[project]
name = "olist-lakehouse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.1.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.5",
    "ruff>=0.17.3",
]

[tool.ruff]
# Globals provided by the Databricks notebook runtime
builtins = ["spark", "display", "dbutils"]
